services:
  db:
    image: mysql:8.4
    container_name: caro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gamecocaro
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - ./CaroServerProject/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
